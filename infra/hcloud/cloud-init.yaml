#cloud-config
ssh_pwauth: false
disable_root: true
users:
  - name: rental-deploy
    gecos: Rental apartments deployment
    groups: [systemd-journal]
    shell: /bin/bash
    lock_passwd: true
    sudo: ["ALL=(ALL) NOPASSWD:ALL"]
    ssh_authorized_keys:
      - __RENTAL_SSH_PUBLIC_KEY__
write_files:
  # __RENTAL_WRITE_FILES__
final_message: "Rental apartments host initialization completed"
