[package]
name = "rental-replay"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"

[dependencies]
libc = "=0.2.189"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
scraper = "=0.27.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }

[profile.release]
strip = true
