services:
  bot:
    image: ${RENTAL_APARTMENTS_IMAGE:?set RENTAL_APARTMENTS_IMAGE to an immutable image reference}
    # A fixed container name makes an accidental `docker compose --scale`
    # invocation fail instead of starting a second writer.
    container_name: rental-apartments-bot
    labels:
      com.rental-apartments.environment: production
    init: true
    user: "node"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    env_file:
      - /etc/rental-apartments/env
    environment:
      NODE_ENV: production
      DATA_DIRECTORY: /app/.data
      BACKUP_DIRECTORY: /app-backups
      CURL_IMPERSONATE_PATH: /usr/local/bin/curl-impersonate
      HEALTH_HOST: 127.0.0.1
      HEALTH_PORT: "8787"
      SQLITE_TMPDIR: /sqlite-tmp
    volumes:
      - rental-apartments-data:/app/.data
      # Recovery points are on a separately provisioned volume. Compose cannot
      # create or delete this independent backup boundary.
      - rental-apartments-backups:/app-backups
    tmpfs:
      - /tmp:size=134217728,mode=1777,nosuid,nodev,noexec
      - /sqlite-tmp:size=134217728,mode=0700,uid=1000,gid=1000,nosuid,nodev,noexec
    restart: "on-failure:5"
    # journald owns persistent, compressed, size-bounded retention on the host.
    # The tag and retained label keep queries scoped to this singleton.
    logging:
      driver: journald
      options:
        tag: rental-apartments.production
        labels: com.rental-apartments.environment
    healthcheck:
      test: ["CMD", "node", "src/health-check.js", "--restart-unresponsive"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 2
    stop_grace_period: 45s
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        order: stop-first
        failure_action: rollback
      rollback_config:
        parallelism: 1
        order: stop-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
        window: 120s

volumes:
  rental-apartments-data:
    name: rental-apartments-data
  rental-apartments-backups:
    name: rental-apartments-backups
    external: true
