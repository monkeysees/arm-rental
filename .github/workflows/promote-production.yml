name: Promote production

# A capability cutover is a pointer move the publisher will not make on its own.
# The bridge release that knows how to perform the cutover has to
# be running on the host before the pointer advances, and publishing that
# bridge is not the same as the host having taken it. Only an operator reading
# the host can tell the difference, so they confirm it here.
on:
  workflow_dispatch:
    inputs:
      revision:
        description: Full 40-character source revision to point production at
        required: true
        type: string
      deployed_bridge_revision:
        description: Revision currently deployed on the host, from `rentalctl status`
        required: true
        type: string
      deployed_bridge_digest:
        description: Immutable image reference currently deployed on the host
        required: true
        type: string

permissions:
  contents: read
  packages: write

# Shared with publish-production: the pointer has one writer at a time.
concurrency:
  group: production-publication
  cancel-in-progress: false

jobs:
  promote:
    name: Promote / production discovery pointer
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the promotion tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Authenticate to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Resolve the requested release and the release production runs
        id: resolve
        env:
          REVISION: ${{ inputs.revision }}
        run: |
          if [[ ! $REVISION =~ ^[0-9a-f]{40}$ ]]; then
            printf 'revision must be a full 40-character Git SHA\n' >&2
            exit 1
          fi
          IMAGE_REPOSITORY="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker pull --quiet "$IMAGE_REPOSITORY:revision-$REVISION" >/dev/null
          IMAGE_REFERENCE="$(docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGE_REPOSITORY:revision-$REVISION")"
          CANDIDATE_REVISION="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$IMAGE_REPOSITORY:revision-$REVISION")"
          CANDIDATE_RUNTIME="$(docker image inspect --format '{{ index .Config.Labels "com.rental-apartments.runtime" }}' "$IMAGE_REPOSITORY:revision-$REVISION")"
          test "$CANDIDATE_RUNTIME" = rust
          test "$CANDIDATE_REVISION" = "$REVISION"

          mkdir -p release current
          docker pull --quiet "$IMAGE_REPOSITORY:metadata-$REVISION" >/dev/null
          CANDIDATE_CONTAINER="$(docker create "$IMAGE_REPOSITORY:metadata-$REVISION" /release/release-metadata.json)"
          docker cp "$CANDIDATE_CONTAINER:/release/." release/
          docker rm "$CANDIDATE_CONTAINER" >/dev/null

          docker pull --quiet "$IMAGE_REPOSITORY:production" >/dev/null
          CURRENT_REVISION="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$IMAGE_REPOSITORY:production")"
          CURRENT_REFERENCE="$(docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGE_REPOSITORY:production")"
          CURRENT_RUNTIME="$(docker image inspect --format '{{ index .Config.Labels "com.rental-apartments.runtime" }}' "$IMAGE_REPOSITORY:production")"
          test "$CURRENT_RUNTIME" = rust
          [[ "$CURRENT_REVISION" =~ ^[0-9a-f]{40}$ ]]
          docker pull --quiet "$IMAGE_REPOSITORY:metadata-$CURRENT_REVISION" >/dev/null
          CURRENT_CONTAINER="$(docker create "$IMAGE_REPOSITORY:metadata-$CURRENT_REVISION" /release/release-metadata.json)"
          docker cp "$CURRENT_CONTAINER:/release/." current/
          docker rm "$CURRENT_CONTAINER" >/dev/null

          # Both metadata objects must name the exact pulled image and runtime.
          jq -e --arg revision "$REVISION" --arg image "$IMAGE_REFERENCE" --arg runtime "$CANDIDATE_RUNTIME" \
            '.sourceRevision == $revision and .imageReference == $image and .runtime == $runtime and .schemaVersion == 3' \
            release/release-metadata.json >/dev/null
          # The current bridge contract must belong to the image production names.
          jq -e --arg revision "$CURRENT_REVISION" --arg image "$CURRENT_REFERENCE" --arg runtime "$CURRENT_RUNTIME" \
            '.sourceRevision == $revision and .imageReference == $image and .runtime == $runtime and .schemaVersion == 3' \
            current/release-metadata.json >/dev/null

          printf 'image_repository=%s\n' "$IMAGE_REPOSITORY" >> "$GITHUB_OUTPUT"
          printf 'image_reference=%s\n' "$IMAGE_REFERENCE" >> "$GITHUB_OUTPUT"
          printf 'current_revision=%s\n' "$CURRENT_REVISION" >> "$GITHUB_OUTPUT"
          printf 'current_reference=%s\n' "$CURRENT_REFERENCE" >> "$GITHUB_OUTPUT"

      # The operator reports what the host is running. If that disagrees with
      # the pointer, the host has not converged and the bridge they checked is
      # not the release this promotion would deploy from.
      - name: Require the confirmed bridge to be the release production runs
        env:
          CONFIRMED: ${{ inputs.deployed_bridge_revision }}
          CONFIRMED_DIGEST: ${{ inputs.deployed_bridge_digest }}
          CURRENT_REVISION: ${{ steps.resolve.outputs.current_revision }}
          CURRENT_REFERENCE: ${{ steps.resolve.outputs.current_reference }}
        run: |
          if [ "$CONFIRMED" != "$CURRENT_REVISION" ] || [ "$CONFIRMED_DIGEST" != "$CURRENT_REFERENCE" ]; then
            printf 'Host-reported revision or digest differs from the production pointer.\n' >&2
            printf 'Let the host converge on the bridge release before promoting.\n' >&2
            exit 1
          fi

      - name: Confirm the running release can deploy the candidate
        env:
          IMAGE_REFERENCE: ${{ steps.resolve.outputs.image_reference }}
          CURRENT_REFERENCE: ${{ steps.resolve.outputs.current_reference }}
        run: |
          python3 scripts/native-release.py verify \
            --image-reference "$IMAGE_REFERENCE" --bundle release
          python3 scripts/native-release.py gate \
            --current-image "$CURRENT_REFERENCE" \
            --current-bundle current \
            --retirement-receipt-record docs/evidence/issue50-bridge-receipt.json \
            --candidate-metadata release/release-metadata.json

      - name: Advance production discovery pointer
        env:
          IMAGE_REPOSITORY: ${{ steps.resolve.outputs.image_repository }}
          IMAGE_REFERENCE: ${{ steps.resolve.outputs.image_reference }}
          CURRENT_REFERENCE: ${{ steps.resolve.outputs.current_reference }}
        run: |
          docker pull --quiet "$IMAGE_REPOSITORY:production" >/dev/null
          test "$(docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGE_REPOSITORY:production")" = "$CURRENT_REFERENCE"
          docker tag "$IMAGE_REFERENCE" "$IMAGE_REPOSITORY:production"
          docker push "$IMAGE_REPOSITORY:production"
          test "$(docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGE_REPOSITORY:production")" = "$IMAGE_REFERENCE"
