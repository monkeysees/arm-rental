[package]
name = "rental-replay"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"

[dependencies]
libc = "=0.2.189"
rusqlite = { version = "=0.40.2", features = ["bundled", "backup"] }
scraper = "=0.27.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
regex = "=1.13.1"
unicode-normalization = "=0.1.25"
sha2 = "=0.11.0"
url = "=2.5.8"

roxmltree = "=0.21.1"

[profile.release]
strip = true
