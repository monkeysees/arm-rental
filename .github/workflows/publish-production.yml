name: Publish production

on:
  workflow_run:
    workflows:
      - Required CI
    types:
      - completed

permissions:
  contents: read
  packages: write

# Once immutable objects are being pushed, a newer commit must wait. Cancelling
# here could strand metadata or advance the discovery pointer out of order.
concurrency:
  group: production-publication
  cancel-in-progress: false

jobs:
  publish:
    name: Publish / scanned production digest
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Rust publication holds the discovery pointer until bridge deployment is confirmed.
    env:
      PRODUCTION_RUNTIME: rust

    steps:
      - name: Check out the exact successful revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Use production Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Validate publication runtime
        run: |
          case "$PRODUCTION_RUNTIME" in
            node|rust) ;;
            *) printf 'Unsupported publication runtime.\n' >&2; exit 1 ;;
          esac

      - name: Build Node bridge from the successful source revision
        if: env.PRODUCTION_RUNTIME == 'node'
        env:
          SOURCE_REVISION: ${{ github.event.workflow_run.head_sha }}
        run: |
          PACKAGE_LOCK_SHA256="$(sha256sum package-lock.json | cut -d ' ' -f 1)"
          docker build \
            --platform linux/amd64 \
            --target production \
            --build-arg SOURCE_REVISION="$SOURCE_REVISION" \
            --build-arg PACKAGE_LOCK_SHA256="$PACKAGE_LOCK_SHA256" \
            --tag rental-apartments:publication \
            .

      - name: Build native candidate from the successful source revision
        if: env.PRODUCTION_RUNTIME == 'rust'
        env:
          SOURCE_REVISION: ${{ github.event.workflow_run.head_sha }}
        run: |
          PACKAGE_LOCK_SHA256="$(sha256sum package-lock.json | cut -d ' ' -f 1)"
          CARGO_LOCK_SHA256="$(sha256sum experiments/rust-replay/Cargo.lock | cut -d ' ' -f 1)"
          docker build -f Dockerfile.native \
            --platform linux/amd64 \
            --target production \
            --build-arg SOURCE_REVISION="$SOURCE_REVISION" \
            --build-arg SOURCE_DIRTY=false \
            --build-arg CARGO_LOCK_SHA256="$CARGO_LOCK_SHA256" \
            --build-arg PACKAGE_LOCK_SHA256="$PACKAGE_LOCK_SHA256" \
            --tag rental-apartments:publication \
            .

      - name: Verify Node runtime and OCI provenance
        if: env.PRODUCTION_RUNTIME == 'node'
        env:
          SOURCE_REVISION: ${{ github.event.workflow_run.head_sha }}
        run: |
          PACKAGE_LOCK_SHA256="$(sha256sum package-lock.json | cut -d ' ' -f 1)"
          MAXIMUM_STATE_SCHEMA="$(node --input-type=module -e 'import { SQLITE_SCHEMA_VERSION } from "./src/sqlite-schema.js"; console.log(SQLITE_SCHEMA_VERSION)')"
          IMAGE=rental-apartments:publication
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$IMAGE")" = "$SOURCE_REVISION"
          RUNTIME="$(docker image inspect --format '{{ index .Config.Labels "com.rental-apartments.runtime" }}' "$IMAGE")"
          case "$RUNTIME" in
            ''|'<no value>'|node) ;;
            *) printf 'Node publication built an unexpected runtime.\n' >&2; exit 1 ;;
          esac
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.node.version" }}' "$IMAGE")" = 24.18.0
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.curl-impersonate.version" }}' "$IMAGE")" = 2.2.2
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.package-lock.sha256" }}' "$IMAGE")" = "$PACKAGE_LOCK_SHA256"
          test "$(docker image inspect --format '{{ index .Config.Labels "com.rental-apartments.state.backend" }}' "$IMAGE")" = sqlite
          test "$(docker image inspect --format '{{ index .Config.Labels "com.rental-apartments.state.schema.minimum" }}' "$IMAGE")" = 1
          test "$(docker image inspect --format '{{ index .Config.Labels "com.rental-apartments.state.schema.maximum" }}' "$IMAGE")" = "$MAXIMUM_STATE_SCHEMA"
          test "$(docker run --rm --entrypoint node "$IMAGE" --version)" = v24.18.0

      - name: Verify native runtime and OCI provenance
        if: env.PRODUCTION_RUNTIME == 'rust'
        env:
          SOURCE_REVISION: ${{ github.event.workflow_run.head_sha }}
        run: |
          PACKAGE_LOCK_SHA256="$(sha256sum package-lock.json | cut -d ' ' -f 1)"
          CARGO_LOCK_SHA256="$(sha256sum experiments/rust-replay/Cargo.lock | cut -d ' ' -f 1)"
          MAXIMUM_STATE_SCHEMA="$(node --input-type=module -e 'import { SQLITE_SCHEMA_VERSION } from "./src/sqlite-schema.js"; console.log(SQLITE_SCHEMA_VERSION)')"
          IMAGE=rental-apartments:publication
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$IMAGE")" = "$SOURCE_REVISION"
          test "$(docker image inspect --format '{{ index .Config.Labels "com.rental-apartments.runtime" }}' "$IMAGE")" = rust
          test "$(docker image inspect --format '{{ index .Config.Labels "com.rental-apartments.source.dirty" }}' "$IMAGE")" = false
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.package-lock.sha256" }}' "$IMAGE")" = "$PACKAGE_LOCK_SHA256"
          test "$(docker image inspect --format '{{ index .Config.Labels "com.rental-apartments.cargo-lock.sha256" }}' "$IMAGE")" = "$CARGO_LOCK_SHA256"
          test "$(docker image inspect --format '{{ index .Config.Labels "com.rental-apartments.state.backend" }}' "$IMAGE")" = sqlite
          test "$(docker image inspect --format '{{ index .Config.Labels "com.rental-apartments.state.schema.minimum" }}' "$IMAGE")" = 1
          test "$(docker image inspect --format '{{ index .Config.Labels "com.rental-apartments.state.schema.maximum" }}' "$IMAGE")" = "$MAXIMUM_STATE_SCHEMA"

      - name: Exercise the exact Node image and HTTP closure
        if: env.PRODUCTION_RUNTIME == 'node'
        run: |
          docker run --rm --entrypoint /usr/local/bin/curl-impersonate rental-apartments:publication --version | grep -F 'curl 8.21.0-IMPERSONATE'
          scripts/smoke-production-runtime-image rental-apartments:publication

      - name: Exercise the exact native image and HTTP closure
        if: env.PRODUCTION_RUNTIME == 'rust'
        run: |
          docker run --rm --entrypoint /usr/local/bin/curl-impersonate rental-apartments:publication --version | grep -F 'curl 8.21.0-IMPERSONATE'
          node experiments/production-image/check.js "$RUNNER_TEMP/publication-native-image-check" rental-apartments:publication

      # This scan occurs before the first registry mutation. The pushed revision
      # tag and production pointer both reference these exact local bytes.
      - name: Scan candidate before publication
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: rental-apartments:publication
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
          version: v0.69.3

      - name: Authenticate to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Refuse an unbridged Rust publication before any registry push
        if: env.PRODUCTION_RUNTIME == 'rust'
        run: |
          IMAGE_REPOSITORY="ghcr.io/${GITHUB_REPOSITORY,,}"
          mkdir -p preflight
          printf '%s\n' '{"stateBackend":"sqlite","runtime":"rust","cutoverRollbackContract":"preserve-live-state-v1"}' > preflight/candidate.json
          PULL_LOG="$(mktemp)"
          if docker pull --quiet "$IMAGE_REPOSITORY:production" >/dev/null 2>"$PULL_LOG"; then
            CURRENT_REVISION="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$IMAGE_REPOSITORY:production")"
            CURRENT_REFERENCE="$(docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGE_REPOSITORY:production")"
            CURRENT_RUNTIME="$(docker image inspect --format '{{ index .Config.Labels "com.rental-apartments.runtime" }}' "$IMAGE_REPOSITORY:production")"
            case "$CURRENT_RUNTIME" in
              ''|'<no value>'|node) CURRENT_RUNTIME=node ;;
              rust) ;;
              *) printf 'Unsupported current production runtime.\n' >&2; exit 1 ;;
            esac
            [[ "$CURRENT_REVISION" =~ ^[0-9a-f]{40}$ ]]
            docker pull --quiet "$IMAGE_REPOSITORY:metadata-$CURRENT_REVISION" >/dev/null
            CURRENT_CONTAINER="$(docker create "$IMAGE_REPOSITORY:metadata-$CURRENT_REVISION" /release/release-metadata.json)"
            trap 'docker rm "$CURRENT_CONTAINER" >/dev/null' EXIT
            docker cp "$CURRENT_CONTAINER:/release/release-metadata.json" preflight/current.json
            jq -e --arg revision "$CURRENT_REVISION" --arg image "$CURRENT_REFERENCE" --arg runtime "$CURRENT_RUNTIME" \
              '.sourceRevision == $revision and .imageReference == $image and (.runtime // "node") == $runtime' preflight/current.json >/dev/null
          elif grep -qiE 'manifest unknown|manifest for .* not found|not found: manifest' "$PULL_LOG"; then
            printf 'A Rust release requires an existing Node bridge production pointer.\n' >&2
            exit 1
          else
            cat "$PULL_LOG" >&2
            printf 'Cannot verify the current production release; refusing publication.\n' >&2
            exit 1
          fi
          node scripts/check-production-transition.js preflight/candidate.json preflight/current.json

      - name: Push immutable candidate and capture scanned digest
        id: candidate
        env:
          SOURCE_REVISION: ${{ github.event.workflow_run.head_sha }}
        run: |
          IMAGE_REPOSITORY="ghcr.io/${GITHUB_REPOSITORY,,}"
          REVISION_TAG="$IMAGE_REPOSITORY:revision-$SOURCE_REVISION"
          docker tag rental-apartments:publication "$REVISION_TAG"
          docker push "$REVISION_TAG"
          IMAGE_REFERENCE="$(docker image inspect --format '{{index .RepoDigests 0}}' "$REVISION_TAG")"
          case "$IMAGE_REFERENCE" in
            "$IMAGE_REPOSITORY"@sha256:????????????????????????????????????????????????????????????????) ;;
            *) printf 'Registry did not return an immutable digest\n' >&2; exit 1 ;;
          esac
          printf 'image_repository=%s\n' "$IMAGE_REPOSITORY" >> "$GITHUB_OUTPUT"
          printf 'image_reference=%s\n' "$IMAGE_REFERENCE" >> "$GITHUB_OUTPUT"

      - name: Publish digest-bound release metadata
        env:
          SOURCE_REVISION: ${{ github.event.workflow_run.head_sha }}
          IMAGE_REPOSITORY: ${{ steps.candidate.outputs.image_repository }}
          IMAGE_REFERENCE: ${{ steps.candidate.outputs.image_reference }}
        run: |
          mkdir -p release metadata-image/release
          git archive --format=tar HEAD ops infra/systemd > release/operations.tar
          node scripts/create-release-metadata.js \
            --source-revision "$SOURCE_REVISION" \
            --runtime "$PRODUCTION_RUNTIME" \
            --image-reference "$IMAGE_REFERENCE" \
            --operations-bundle release/operations.tar \
            --output release/release-metadata.json
          cp \
            release/release-metadata.json \
            release/operations.tar \
            compose.production.yaml \
            package-lock.json \
            metadata-image/release/
          printf '%s\n' \
            'FROM scratch' \
            'COPY release/ /release/' \
            > metadata-image/Dockerfile
          METADATA_TAG="$IMAGE_REPOSITORY:metadata-$SOURCE_REVISION"
          docker build --tag "$METADATA_TAG" metadata-image
          docker push "$METADATA_TAG"
          # The scratch image intentionally has no default command. Docker still
          # requires one to create the stopped container used only for `docker cp`.
          METADATA_CONTAINER="$(docker create "$METADATA_TAG" /release/release-metadata.json)"
          trap 'docker rm "$METADATA_CONTAINER" >/dev/null' EXIT
          mkdir release/published
          docker cp "$METADATA_CONTAINER:/release/." release/published/
          cmp release/release-metadata.json release/published/release-metadata.json
          cmp release/operations.tar release/published/operations.tar
          cmp compose.production.yaml release/published/compose.production.yaml
          cmp package-lock.json release/published/package-lock.json

      # The host deploys each candidate using the operations bundle of the
      # release it is already running, so a candidate that release cannot
      # deploy becomes undeployable the instant the pointer moves, and the
      # host retries it every five minutes until someone intervenes.
      # Classify backend and runtime transitions before the pointer is touched.
      - name: Classify the state transition against production
        id: transition
        env:
          IMAGE_REPOSITORY: ${{ steps.candidate.outputs.image_repository }}
        run: |
          # Absent current metadata means "no pointer exists yet", which is
          # what the classifier reads as an unguarded first publish. Only a
          # registry that answers with a missing manifest may produce it: a
          # denied, throttled, or unreachable registry must not be able to
          # retire the guard.
          PULL_LOG="$(mktemp)"
          if docker pull --quiet "$IMAGE_REPOSITORY:production" >/dev/null 2>"$PULL_LOG"; then
            CURRENT_REVISION="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$IMAGE_REPOSITORY:production")"
            docker pull --quiet "$IMAGE_REPOSITORY:metadata-$CURRENT_REVISION" >/dev/null
            CURRENT_CONTAINER="$(docker create "$IMAGE_REPOSITORY:metadata-$CURRENT_REVISION" /release/release-metadata.json)"
            trap 'docker rm "$CURRENT_CONTAINER" >/dev/null' EXIT
            mkdir -p current
            docker cp "$CURRENT_CONTAINER:/release/release-metadata.json" current/release-metadata.json
          elif grep -qiE 'manifest unknown|manifest for .* not found|not found: manifest' "$PULL_LOG"; then
            printf 'No production pointer exists yet; this is the first publication.\n'
          else
            cat "$PULL_LOG" >&2
            printf 'Could not read the release production runs, so the state '
            printf 'transition cannot be classified. Refusing to advance the '
            printf 'production pointer.\n' >&2
            exit 1
          fi
          node scripts/check-production-transition.js \
            release/release-metadata.json \
            current/release-metadata.json

      # This is intentionally last: the host sees a new digest only after the
      # candidate, its exact metadata, and every earlier quality gate exist.
      # A state-backend or runtime cutover is deliberately excluded. Publishing the
      # bridge release is not the same as the host having deployed it, and
      # only the host knows which, so promote-production advances the
      # pointer once an operator has confirmed it.
      - name: Advance production discovery pointer
        if: steps.transition.outputs.cutover != 'true'
        env:
          IMAGE_REPOSITORY: ${{ steps.candidate.outputs.image_repository }}
          IMAGE_REFERENCE: ${{ steps.candidate.outputs.image_reference }}
        run: |
          docker tag "$IMAGE_REFERENCE" "$IMAGE_REPOSITORY:production"
          docker push "$IMAGE_REPOSITORY:production"
          test "$(docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGE_REPOSITORY:production")" = "$IMAGE_REFERENCE"

      - name: Report the held cutover
        if: steps.transition.outputs.cutover == 'true'
        env:
          IMAGE_REFERENCE: ${{ steps.candidate.outputs.image_reference }}
        run: |
          printf 'Published %s without advancing the production pointer.\n' "$IMAGE_REFERENCE"
          printf 'This release changes the state backend or runtime. Confirm the bridge '
          printf 'release is deployed on the host, then run promote-production.\n'
