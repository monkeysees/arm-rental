name: Required CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Required / quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use production Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Record runtime
        run: node --version

      - name: Install locked dependencies
        run: npm ci

      - name: Build and check the native application with the pinned toolchain
        run: |
          docker build -f experiments/rust-replay/Dockerfile.build -t rental-rust-build .
          docker run --rm -v "$PWD:/repo" \
            -v "$(command -v node):/usr/local/bin/node:ro" \
            -w /repo/experiments/rust-replay rental-rust-build \
            sh -c 'cargo fmt --check && cargo check --locked --all-targets && cargo clippy --locked --all-targets -- -D warnings && cargo test --locked && cargo build --locked --bin rental-app'
          printf 'RENTAL_APP_BINARY=%s/experiments/rust-replay/target/debug/rental-app\n' "$PWD" >> "$GITHUB_ENV"

      - name: Run lint, format, and test checks
        run: npm run check

      - name: Validate production deployment contract
        run: npm run check:production-contract

      - name: Enforce coverage floors
        run: npm run test:coverage

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  production-artifact:
    name: Required / production artifact
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use production Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Build production image
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          PACKAGE_LOCK_SHA256="$(sha256sum package-lock.json | cut -d ' ' -f 1)"
          docker build \
            --platform linux/amd64 \
            --target production \
            --build-arg SOURCE_REVISION="$SOURCE_REVISION" \
            --build-arg PACKAGE_LOCK_SHA256="$PACKAGE_LOCK_SHA256" \
            --tag rental-apartments-bot:ci \
            .

      - name: Verify deployment runtime metadata
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          PACKAGE_LOCK_SHA256="$(sha256sum package-lock.json | cut -d ' ' -f 1)"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' rental-apartments-bot:ci)" = "$SOURCE_REVISION"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.node.version" }}' rental-apartments-bot:ci)" = "24.18.0"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.curl-impersonate.version" }}' rental-apartments-bot:ci)" = "2.2.2"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.package-lock.sha256" }}' rental-apartments-bot:ci)" = "$PACKAGE_LOCK_SHA256"
          test "$(docker run --rm --entrypoint node rental-apartments-bot:ci --version)" = "v24.18.0"
          docker run --rm --entrypoint /usr/local/bin/curl-impersonate rental-apartments-bot:ci --version | grep -F 'curl 8.21.0-IMPERSONATE'

      - name: Smoke-test production HTTP transport
        run: scripts/smoke-production-runtime-image rental-apartments-bot:ci

      - name: Build and exercise the native candidate image
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          python3 scripts/native-release.py build \
            --source-revision "$SOURCE_REVISION" \
            --work-dir "$RUNNER_TEMP/native-release" \
            --image-tag rental-apartments-native:ci

      - name: Verify Cargo producer, metadata, and transition gates
        run: PYTHONDONTWRITEBYTECODE=1 python3 test/native-release-producer.test.py

      - name: Verify native production parity without Node
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          python3 experiments/native-acceptance/run.py \
            --image rental-apartments-native:ci \
            --output "$RUNNER_TEMP/native-acceptance" \
            --expected-revision "$SOURCE_REVISION" \
            --require-clean-source

      - name: Exercise production-shaped Cargo deployment and historical Node rollback
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 experiments/native-cutover/run.py \
            --node-image rental-apartments-bot:ci \
            --native-image rental-apartments-native:ci \
            --output "$RUNNER_TEMP/cargo-cutover"

      - name: Verify native 500-recipient capacity without Node
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          pressure_total() {
            awk '$1 == "some" {for (i = 2; i <= NF; i++) if ($i ~ /^total=/) {sub(/^total=/, "", $i); print $i; exit}}' "$1" 2>/dev/null || true
          }
          cgroup_counter() {
            awk -v key="$1" '$1 == key {print $2; exit}' /sys/fs/cgroup/cpu.stat 2>/dev/null || true
          }
          delta() {
            local start="$1" end="$2"
            if [[ "$start" =~ ^[0-9]+$ && "$end" =~ ^[0-9]+$ ]]; then
              printf '%s' "$((end - start))"
            else
              printf 'unavailable'
            fi
          }
          monitor_pid=
          gate_pid=
          cleanup() {
            local status="$?"
            trap - EXIT INT TERM
            if [[ -n "$gate_pid" ]]; then
              kill -TERM "$gate_pid" 2>/dev/null || true
              for _ in 1 2 3 4 5; do
                kill -0 "$gate_pid" 2>/dev/null || break
                sleep 1
              done
              kill -KILL "$gate_pid" 2>/dev/null || true
              wait "$gate_pid" 2>/dev/null || true
            fi
            if [[ -n "$monitor_pid" ]]; then
              kill "$monitor_pid" 2>/dev/null || true
              wait "$monitor_pid" 2>/dev/null || true
            fi
            exit "$status"
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          cores="$(nproc 2>/dev/null || true)"
          load_before="$(awk '{print $1}' /proc/loadavg 2>/dev/null || true)"
          cpu_before="$(pressure_total /proc/pressure/cpu)"
          io_before="$(pressure_total /proc/pressure/io)"
          periods_before="$(cgroup_counter nr_throttled)"
          throttle_before="$(cgroup_counter throttled_usec)"
          telemetry_file="$RUNNER_TEMP/native-capacity-vmstat.log"
          if command -v vmstat >/dev/null; then
            vmstat -n 10 > "$telemetry_file" &
            monitor_pid="$!"
          fi
          python3 experiments/native-capacity/run.py \
            --image rental-apartments-native:ci \
            --output "$RUNNER_TEMP/native-capacity" \
            --users 500 \
            --expected-revision "$SOURCE_REVISION" \
            --require-clean-source &
          gate_pid="$!"
          if wait "$gate_pid"; then gate_status=0; else gate_status="$?"; fi
          gate_pid=
          if [[ -n "$monitor_pid" ]]; then
            kill "$monitor_pid" 2>/dev/null || true
            wait "$monitor_pid" 2>/dev/null || true
            monitor_pid=
          fi
          load_after="$(awk '{print $1}' /proc/loadavg 2>/dev/null || true)"
          printf 'CAPACITY_RUNNER_TELEMETRY cores=%s load1_start=%s load1_end=%s cpu_pressure_some_us=%s io_pressure_some_us=%s cgroup_throttled_periods=%s cgroup_throttled_us=%s\n' \
            "${cores:-unavailable}" "${load_before:-unavailable}" "${load_after:-unavailable}" \
            "$(delta "$cpu_before" "$(pressure_total /proc/pressure/cpu)")" \
            "$(delta "$io_before" "$(pressure_total /proc/pressure/io)")" \
            "$(delta "$periods_before" "$(cgroup_counter nr_throttled)")" \
            "$(delta "$throttle_before" "$(cgroup_counter throttled_usec)")" || true
          if [[ -s "$telemetry_file" ]]; then
            awk 'BEGIN {min_idle = 100} NR > 3 && NF >= 17 {count++; if ($1 > runnable) runnable = $1; if ($2 > blocked) blocked = $2; if ($16 > iowait) iowait = $16; if ($17 > steal) steal = $17; if ($15 < min_idle) min_idle = $15} END {if (count > 0) printf "CAPACITY_RUNNER_VMSTAT samples=%d max_runnable=%d max_blocked=%d max_iowait_pct=%d max_steal_pct=%d min_idle_pct=%d\n", count, runnable, blocked, iowait, steal, min_idle}' "$telemetry_file" || true
          fi
          exit "$gate_status"

      - name: Scan OS and application dependencies
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: rental-apartments-bot:ci
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
          version: v0.69.3

      - name: Scan native OS and linked application dependencies
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: rental-apartments-native:ci
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
          version: v0.69.3
