services:
  bot:
    image: ${RENTAL_APARTMENTS_IMAGE:?set RENTAL_APARTMENTS_IMAGE to an immutable image reference}
    # A fixed container name makes an accidental `docker compose --scale`
    # invocation fail instead of starting a second writer.
    container_name: rental-apartments-bot
    init: true
    user: "node"
    read_only: true
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      DATA_DIRECTORY: /app/.data
      BROWSER_HEADLESS: "true"
      CHROME_EXECUTABLE_PATH: /opt/chrome/chrome/linux-150.0.7871.24/chrome-linux64/chrome
      HEALTH_HOST: 127.0.0.1
      HEALTH_PORT: "8787"
    volumes:
      - rental-apartments-data:/app/.data
    tmpfs:
      - /tmp:size=134217728,mode=1777,nosuid,nodev,noexec
      - /dev/shm:size=268435456,mode=1777,nosuid,nodev,noexec
    restart: "on-failure:5"
    # Production refuses a host-only logging configuration. The collector must
    # forward these JSON records to durable storage with >=14-day retention.
    logging:
      driver: fluentd
      options:
        fluentd-address: ${LOG_COLLECTOR_ADDRESS:?set LOG_COLLECTOR_ADDRESS to an external Fluent Bit/Fluentd endpoint}
        fluentd-async: "true"
        tag: rental-apartments.production
    healthcheck:
      test: ["CMD", "node", "src/health-check.js", "--restart-unresponsive"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 2
    stop_grace_period: 45s
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        order: stop-first
        failure_action: rollback
      rollback_config:
        parallelism: 1
        order: stop-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
        window: 120s

volumes:
  rental-apartments-data:
    name: rental-apartments-data
